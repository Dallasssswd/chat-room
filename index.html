<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Chat Room</title>
  <script src="https://unpkg.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 15px;
    }
    .chat-container {
      width: 100%;
      max-width: 550px;
      background: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      height: 85vh;
      overflow: hidden;
    }
    .header {
      background: #252526;
      padding: 15px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h2 {
      font-size: 1.1rem;
    }
    #room-status {
      font-size: 0.85rem;
      color: #4ade80;
    }
    .login-bar {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #252526;
      border-bottom: 1px solid #333;
    }
    input {
      background: #2d2d2d;
      border: 1px solid #444;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      outline: none;
      font-size: 0.95rem;
    }
    input:focus {
      border-color: #3b82f6;
    }
    .login-bar input {
      flex: 1;
      min-width: 0;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
    #chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      background: #2a2a2a;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 85%;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .msg-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.75rem;
      color: #aaa;
      margin-bottom: 4px;
    }
    .msg-author {
      font-weight: bold;
      color: #60a5fa;
    }
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #252526;
      border-top: 1px solid #333;
    }
    .input-bar input {
      flex: 1;
    }
    .system-msg {
      text-align: center;
      color: #888;
      font-size: 0.85rem;
      margin: auto 0;
    }
    .error-msg {
      text-align: center;
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="header">
      <h2>Private Chat</h2>
      <span id="room-status">Checking...</span>
    </div>

    <div class="login-bar">
      <input type="text" id="username" placeholder="Your name" maxlength="20" />
      <input type="text" id="room-code" placeholder="Room code (e.g. 1234)" />
      <button id="join-btn">Join</button>
    </div>

    <div id="chat-box">
      <div class="system-msg" id="status-box">Starting up...</div>
    </div>

    <div class="input-bar">
      <input type="text" id="message-input" placeholder="Type a message..." disabled />
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const joinBtn = document.getElementById('join-btn');
    const roomStatus = document.getElementById('room-status');

    // Show any JavaScript errors right on screen
    window.onerror = function(msg, url, line) {
      roomStatus.textContent = 'Script Error';
      chatBox.innerHTML = `<div class="error-msg">Error on line ${line}: ${msg}</div>`;
    };

    const SUPABASE_URL = 'https://zilpqsqwoxoaewadwfpk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FpJe6fT3X_QhPNiCXg6iVQ_sT3VDpuH';

    let supabaseClient = null;
    let currentRoom = '';
    let subscription = null;

    // Check if Supabase library loaded properly
    if (typeof window.supabase === 'undefined') {
      roomStatus.textContent = 'Blocked';
      chatBox.innerHTML = '<div class="error-msg">Your school network blocked unpkg.com (the Supabase script).</div>';
    } else {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      roomStatus.textContent = 'Ready';
      chatBox.innerHTML = '<div class="system-msg">Enter your name and a room code above, then click Join.</div>';
    }

    joinBtn.addEventListener('click', joinRoom);
    sendBtn.addEventListener('click', sendMessage);
    document.getElementById('room-code').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinRoom();
    });
    msgInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    async function joinRoom() {
      if (!supabaseClient) return;
      const roomInput = document.getElementById('room-code').value.trim();
      if (!roomInput) {
        alert('Please enter a room code.');
        return;
      }

      currentRoom = roomInput;
      roomStatus.textContent = 'Connecting...';
      chatBox.innerHTML = '<div class="system-msg">Loading messages...</div>';

      try {
        const { data, error } = await supabaseClient
          .from('messages')
          .select('*')
          .eq('room_code', currentRoom)
          .order('created_at', { ascending: true });

        if (error) {
          roomStatus.textContent = 'DB Error';
          chatBox.innerHTML = `<div class="error-msg">Supabase Error: ${error.message}</div>`;
          return;
        }

        chatBox.innerHTML = '';
        if (data.length === 0) {
          chatBox.innerHTML = '<div class="system-msg" id="empty-notice">No messages yet. Say hello!</div>';
        } else {
          data.forEach(displayMessage);
        }

        msgInput.disabled = false;
        sendBtn.disabled = false;
        roomStatus.textContent = `Room: ${currentRoom}`;
        msgInput.focus();

        if (subscription) {
          supabaseClient.removeChannel(subscription);
        }

        subscription = supabaseClient
          .channel('room-' + currentRoom)
          .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'messages',
            filter: `room_code=eq.${currentRoom}`
          }, payload => {
            const emptyNotice = document.getElementById('empty-notice');
            if (emptyNotice) emptyNotice.remove();
            displayMessage(payload.new);
          })
          .subscribe();

      } catch (err) {
        roomStatus.textContent = 'Network Error';
        chatBox.innerHTML = `<div class="error-msg">Network Error: ${err.message} (School Wi-Fi may be blocking supabase.co)</div>`;
      }
    }

    async function sendMessage() {
      const username = document.getElementById('username').value.trim() || 'Anonymous';
      const content = msgInput.value.trim();
      if (!currentRoom || !content) return;

      msgInput.value = '';

      const { error } = await supabaseClient
        .from('messages')
        .insert([{
          room_code: currentRoom,
          username: username,
          content: content
        }]);

      if (error) {
        chatBox.innerHTML += `<div class="error-msg">Send failed: ${error.message}</div>`;
      }
    }

    function displayMessage(msg) {
      const div = document.createElement('div');
      div.className = 'msg';
      const time = new Date(msg.created_at).toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });

      div.innerHTML = `
        <div class="msg-header">
          <span class="msg-author">${escapeHTML(msg.username)}</span>
          <span>${time}</span>
        </div>
        <div>${escapeHTML(msg.content)}</div>
      `;

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag]));
    }
  </script>
</body>
</html>
